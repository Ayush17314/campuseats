openapi: 3.0.3
info:
  title: CampusEats Orders API
  version: 3.0.0
  description: Assignment 6 status codes, validation, negotiation, and Problem Details.
servers:
  - url: http://localhost:5000
paths:
  /orders:
    post:
      summary: Create an order; repeated Idempotency-Key returns original order
      parameters:
        - {name: Authorization, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOrder'}
      responses:
        '201': {description: Created, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}, application/xml: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '406': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
    get:
      summary: List orders for a user
      parameters:
        - {name: userId, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: Authorization, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Orders list}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '406': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /orders/{orderId}:
    parameters:
      - {name: orderId, in: path, required: true, schema: {type: string}}
    get:
      summary: Read order (supports conditional GET)
      responses:
        '200': {description: Order representation}
        '304': {description: Unchanged representation}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '406': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    patch:
      summary: Replace address and items using If-Match
      parameters:
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [addressId, items], properties: {addressId: {type: integer, minimum: 1}, items: {type: array, minItems: 1}}}
      responses:
        '200': {description: Updated order}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
    delete:
      summary: Delete order
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      responses:
        '200': {description: Cancelled order}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
components:
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errors:
          type: array
          items: {type: object, required: [field, message], properties: {field: {type: string}, message: {type: string}}}
    CreateOrder:
      type: object
      required: [userId, addressId, items, cardToken]
      properties:
        userId: {type: integer, minimum: 1}
        addressId: {type: integer, minimum: 1}
        cardToken: {type: string, minLength: 1}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, quantity, unitPrice]
            properties: {itemId: {type: integer, minimum: 1}, quantity: {type: integer, minimum: 1, description: qty}, unitPrice: {type: string, pattern: '^\\d+(\\.\\d{1,2})?$'}}
    Order:
      type: object
      properties: {orderId: {type: string}, userId: {type: integer}, addressId: {type: integer}, items: {type: array}, totalAmount: {type: string}, status: {type: string}}
  responses:
    Problem:
      description: Problem Details error
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
